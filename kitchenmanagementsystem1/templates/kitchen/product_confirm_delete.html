{% extends 'base.html' %}

{% block title %}Mahsulotni o'chirish{% endblock %}

{% block content %}
<div class="card">
    <div class="card-title">🗑️ Mahsulotni o'chirish</div>
    
    <div style="font-size: 28px; margin-bottom: 30px;">
        Haqiqatan ham <strong>{{ product.name }}</strong> mahsulotini o'chirmoqchimisiz?
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="flex flex-gap">
            <button type="submit" class="btn btn-danger">
                ✅ Ha, o'chirish
            </button>
            
            <a href="{% url 'kitchen:products_list' %}" class="btn btn-gray">
                ❌ Yo'q, bekor qilish
            </a>
        </div>
    </form>
</div>
{% endblock %}
